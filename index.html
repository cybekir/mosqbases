<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche et Export Mosquées Maghreb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080D1A; color: #E2E8F0; }
        .card-dark { background-color: #0F172A; border: 1px solid rgba(16, 185, 129, 0.2); }
        .input-dark { background-color: #1E293B; border: 1px solid #334155; color: #F8FAFC; }
        .input-dark:focus { border-color: #10B981; outline: none; }
        .btn-neon { background-color: #10B981; color: #022C22; font-weight: 700; }
        .btn-neon:hover { background-color: #34D399; }
        .btn-save { background-color: #059669; color: white; }
        .btn-save:hover { background-color: #047857; }
        .btn-edit { background-color: #D97706; color: white; }
        .btn-edit:hover { background-color: #B45309; }
        .btn-delete { background-color: #7C3AED; color: white; }
        .btn-delete:hover { background-color: #6D28D9; }
    </style>
</head>
<body class="min-h-screen text-slate-100 p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center card-dark p-6 rounded-2xl shadow-xl gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-xl">
                    🕌
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">
                        Mosquées Maghreb
                    </h1>
                    <p class="text-xs text-emerald-400/80 font-medium">Recherche & Cartographie interactive des lieux de culte</p>
                </div>
            </div>
            <button onclick="exportCSV()" class="flex items-center gap-2 btn-neon px-4 py-2.5 rounded-xl shadow-lg transition">
                <span>📥 Copier / Export CSV</span>
            </button>
        </header>

        <!-- Formulaire de Recherche -->
        <div class="card-dark p-6 rounded-2xl shadow-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                
                <!-- Pays -->
                <div>
                    <label class="block text-xs font-bold text-emerald-400 tracking-wider uppercase mb-2">PAYS</label>
                    <select id="countrySelect" class="w-full px-3 py-2.5 input-dark rounded-xl font-medium text-sm">
                        <option value="TN" selected>🇹🇳 Tunisie</option>
                        <option value="MA">🇲🇦 Maroc</option>
                        <option value="DZ">🇩🇿 Algérie</option>
                        <option value="LY">🇱🇾 Libye</option>
                    </select>
                </div>

                <!-- Portée -->
                <div>
                    <label class="block text-xs font-bold text-emerald-400 tracking-wider uppercase mb-2">TYPE / PORTÉE</label>
                    <select id="scopeSelect" onchange="toggleScopeInput()" class="w-full px-3 py-2.5 input-dark rounded-xl font-medium text-sm">
                        <option value="city" selected>Par Ville / Commune</option>
                        <option value="region">Par Gouvernorat / Région</option>
                    </select>
                </div>

                <!-- Champ Nom de Ville -->
                <div>
                    <label id="locationLabel" class="block text-xs font-bold text-emerald-400 tracking-wider uppercase mb-2">VILLE OU RÉGION</label>
                    <input type="text" id="locationInput" placeholder="Ex: Mahdia, Monastir, Nabeul..." value="Mahdia" class="w-full px-3 py-2.5 input-dark rounded-xl text-sm font-medium">
                </div>

                <!-- Bouton Lancer Recherche -->
                <div>
                    <button onclick="searchMosques()" class="w-full btn-neon px-4 py-2.5 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                        <span>🔍 Rechercher</span>
                    </button>
                </div>
            </div>

            <!-- Message d'état -->
            <div id="statusMsg" class="hidden mt-2 p-3 bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 rounded-xl text-sm font-medium flex items-center gap-2">
                <svg class="animate-spin h-4 w-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="statusText">Recherche en cours...</span>
            </div>
        </div>

        <!-- Tableau des résultats -->
        <div class="card-dark rounded-2xl shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h2 class="font-bold text-white tracking-wide">Résultats de la recherche</h2>
                    <span id="countBadge" class="bg-emerald-950 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full text-xs font-bold">0 lieu(x)</span>
                </div>
                <button onclick="openAddModal()" class="flex items-center gap-1.5 btn-neon text-xs px-3 py-2 rounded-xl shadow-md transition">
                    <span>➕ Ajouter une mosquée</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900 border-b border-slate-800 text-emerald-400 uppercase text-xs font-bold">
                        <tr>
                            <th class="px-4 py-3.5 min-w-[200px]">Nom</th>
                            <th class="px-4 py-3.5 min-w-[280px] max-w-[360px]">Adresse / Carte Maps</th>
                            <th class="px-4 py-3.5">Coordonnées GPS</th>
                            <th class="px-4 py-3.5">Téléphone</th>
                            <th class="px-4 py-3.5 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modale d'Édition / Ajout -->
    <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex justify-center items-center p-4 z-50">
        <div class="card-dark rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-emerald-500/40">
            <h3 id="modalTitle" class="text-lg font-bold text-emerald-400 border-b border-slate-800 pb-2">Modifier l'enregistrement</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nom de la mosquée</label>
                    <input type="text" id="editNom" placeholder="Ex: Grande Mosquée de Mahdia" class="w-full p-2.5 input-dark rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Ville</label>
                    <input type="text" id="editVille" placeholder="Ex: Mahdia" class="w-full p-2.5 input-dark rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Adresse</label>
                    <input type="text" id="editAdresse" placeholder="Ex: Centre Historique, Mahdia, Tunisie" class="w-full p-2.5 input-dark rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Coordonnées GPS (Lat, Lon)</label>
                    <input type="text" id="editGps" placeholder="Ex: 35.5047, 11.0622" class="w-full p-2.5 input-dark rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Téléphone</label>
                    <input type="text" id="editTelephone" placeholder="Optionnel" class="w-full p-2.5 input-dark rounded-xl text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-4 border-t border-slate-800">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white rounded-lg">Annuler</button>
                <button onclick="saveModalChanges()" class="px-4 py-2 text-sm btn-neon font-bold rounded-xl shadow-lg">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        let mosquesData = [];
        let editingIndex = null;

        const countryNamesFR = {
            TN: "Tunisie",
            MA: "Maroc",
            DZ: "Algérie",
            LY: "Libye"
        };

        function toggleScopeInput() {
            const scope = document.getElementById('scopeSelect').value;
            const label = document.getElementById('locationLabel');
            label.innerText = scope === 'city' ? "Nom de la Ville" : "Nom du Gouvernorat / Région";
        }

        function normalizeString(str) {
            if (!str) return '';
            return str.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        async function searchMosques() {
            const country = document.getElementById('countrySelect').value;
            const locationVal = document.getElementById('locationInput').value.trim();
            const scopeVal = document.getElementById('scopeSelect').value;
            const statusMsg = document.getElementById('statusMsg');
            const statusText = document.getElementById('statusText');
            const countryName = countryNamesFR[country];

            if (!locationVal) {
                alert("Veuillez saisir le nom d'une ville.");
                return;
            }

            statusMsg.classList.remove('hidden');
            statusText.innerText = `Recherche des lieux à ${locationVal} (${countryName})...`;

            try {
                const searchUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent('mosque ' + locationVal + ' ' + countryName)}&format=json&addressdetails=1&limit=300`;

                const response = await fetch(searchUrl, {
                    headers: { 'Accept-Language': 'fr,ar' }
                });

                if (!response.ok) {
                    throw new Error("Impossible d'accéder au service de recherche cartographique.");
                }

                let data = await response.json();
                
                if (!data || data.length === 0) {
                    const fallbackUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locationVal + ' ' + countryName)}&amenity=place_of_worship&format=json&addressdetails=1&limit=300`;
                    const fallbackResp = await fetch(fallbackUrl, { headers: { 'Accept-Language': 'fr,ar' } });
                    data = await fallbackResp.json();
                }

                if (!data || data.length === 0) {
                    mosquesData = [];
                    renderTable();
                    return;
                }

                parseAndDisplayNominatim(data, country, locationVal, scopeVal);

            } catch (err) {
                const tbody = document.getElementById('resultsTableBody');
                document.getElementById('countBadge').innerText = "0 lieu(x)";
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-red-500 font-medium">
                            ⚠️ ${escapeHtml(err.message || "Erreur de connexion lors de la recherche.")}
                        </td>
                    </tr>
                `;
            } finally {
                statusMsg.classList.add('hidden');
            }
        }

        function parseAndDisplayNominatim(elements, countryCode, searchedCity, scope) {
            mosquesData = [];
            const defaultCountry = countryNamesFR[countryCode] || "";
            const normalizedSearch = normalizeString(searchedCity);

            elements.forEach(item => {
                const addr = item.address || {};
                let detectedCity = addr.city || addr.town || addr.village || addr.municipality || addr.suburb || "";
                
                const normDetectedCity = normalizeString(detectedCity);
                const normDisplayName = normalizeString(item.display_name);

                if (scope === 'city') {
                    if (normDetectedCity) {
                        if (normDetectedCity !== normalizedSearch && !normDetectedCity.includes(normalizedSearch)) {
                            return;
                        }
                    } else {
                        if (!normDisplayName.includes(normalizedSearch)) {
                            return;
                        }
                        detectedCity = searchedCity;
                    }
                } else {
                    if (!detectedCity) detectedCity = searchedCity;
                }

                let name = item.name || (item.display_name ? item.display_name.split(',')[0] : `Mosquée (${detectedCity})`);
                
                const road = addr.road || addr.suburb || addr.neighbourhood || addr.quarter || "";
                let fullAddress = "";
                if (road) fullAddress += road + ", ";
                fullAddress += detectedCity + ", " + defaultCountry;

                const latVal = item.lat || "";
                const lonVal = item.lon || "";

                const mapsQuery = (latVal && lonVal) ? `${latVal},${lonVal}` : encodeURIComponent(`${name}, ${detectedCity}, ${defaultCountry}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

                mosquesData.push({
                    nom: name,
                    ville: detectedCity,
                    adresse: fullAddress,
                    mapsUrl: mapsUrl,
                    lat: latVal,
                    lon: lonVal,
                    telephone: addr.phone || "-"
                });
            });

            mosquesData.sort((a, b) => a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' }));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('resultsTableBody');
            const countBadge = document.getElementById('countBadge');
            
            countBadge.innerText = `${mosquesData.length} lieu(x)`;
            tbody.innerHTML = '';

            if (mosquesData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-4 py-8 text-center text-slate-400">
                            Aucune mosquée trouvée strictement dans cette commune. Vous pouvez en ajouter une manuellement.
                        </td>
                    </tr>
                `;
                return;
            }

            mosquesData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-800/60 hover:bg-slate-800/40 transition duration-150';
                
                const hasGps = item.lat && item.lon;
                const gpsFull = hasGps ? `${parseFloat(item.lat).toFixed(5)}, ${parseFloat(item.lon).toFixed(5)}` : '-';
                
                tr.innerHTML = `
                    <td class="px-4 py-3 font-semibold text-white max-w-[220px]">
                        <div class="line-clamp-2" title="${escapeHtml(item.nom)}">${escapeHtml(item.nom)}</div>
                    </td>
                    <td class="px-4 py-3 max-w-[340px]">
                        <a href="${item.mapsUrl}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:text-emerald-300 hover:underline font-medium block truncate" title="${escapeHtml(item.adresse)}">
                            ${escapeHtml(item.adresse)}
                        </a>
                    </td>
                    <td class="px-4 py-3 text-slate-300 font-mono text-xs whitespace-nowrap">
                        ${hasGps ? `
                            <div class="flex items-center gap-1.5">
                                <span class="bg-slate-800 text-emerald-300 px-2 py-1 rounded border border-emerald-500/30 select-all">${gpsFull}</span>
                                <button onclick="copyGps('${gpsFull}')" title="Copier les coordonnées" class="p-1 text-slate-400 hover:text-emerald-400 rounded">📋</button>
                            </div>
                        ` : '-'}
                    </td>
                    <td class="px-4 py-3 text-slate-400 whitespace-nowrap">${escapeHtml(item.telephone)}</td>
                    <td class="px-4 py-3 text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button onclick="saveItem(${index})" class="px-2.5 py-1 text-xs rounded btn-save font-medium transition shadow-sm">💾 Sauvegarder</button>
                            <button onclick="openEditModal(${index})" class="px-2.5 py-1 text-xs rounded btn-edit font-medium transition shadow-sm">✏️ Modifier</button>
                            <button onclick="deleteItem(${index})" class="px-2.5 py-1 text-xs rounded btn-delete font-medium transition shadow-sm">🗑️ Supprimer</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function copyGps(text) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert(`Coordonnées GPS copiées dans le presse-papier : ${text}`);
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').innerText = "Ajouter une mosquée";
            const defaultCity = document.getElementById('locationInput').value.trim() || "Mahdia";
            const countryCode = document.getElementById('countrySelect').value;
            const countryName = countryNamesFR[countryCode] || "Tunisie";

            document.getElementById('editNom').value = "";
            document.getElementById('editVille').value = defaultCity;
            document.getElementById('editAdresse').value = `${defaultCity}, ${countryName}`;
            document.getElementById('editGps').value = "";
            document.getElementById('editTelephone').value = "-";
            document.getElementById('editModal').classList.remove('hidden');
        }

        function openEditModal(index) {
            editingIndex = index;
            document.getElementById('modalTitle').innerText = "Modifier l'enregistrement";
            const item = mosquesData[index];
            document.getElementById('editNom').value = item.nom;
            document.getElementById('editVille').value = item.ville;
            document.getElementById('editAdresse').value = item.adresse;
            
            const gpsVal = (item.lat && item.lon) ? `${item.lat}, ${item.lon}` : "";
            document.getElementById('editGps').value = gpsVal;
            
            document.getElementById('editTelephone').value = item.telephone;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingIndex = null;
        }

        function saveModalChanges() {
            const nom = document.getElementById('editNom').value.trim();
            const ville = document.getElementById('editVille').value.trim();
            const adresse = document.getElementById('editAdresse').value.trim();
            const gpsInput = document.getElementById('editGps').value.trim();
            const telephone = document.getElementById('editTelephone').value.trim() || "-";

            if (!nom || !ville) {
                alert("Le nom et la ville sont obligatoires.");
                return;
            }

            let lat = "";
            let lon = "";
            if (gpsInput.includes(',')) {
                const parts = gpsInput.split(',');
                lat = parts[0].trim();
                lon = parts[1].trim();
            }

            const mapsQuery = (lat && lon) ? `${lat},${lon}` : encodeURIComponent(`${nom}, ${ville}`);
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

            const newItem = {
                nom: nom,
                ville: ville,
                adresse: adresse,
                mapsUrl: mapsUrl,
                lat: lat,
                lon: lon,
                telephone: telephone
            };

            if (editingIndex === -1) {
                mosquesData.unshift(newItem);
            } else if (editingIndex !== null) {
                mosquesData[editingIndex] = newItem;
            }

            renderTable();
            closeModal();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function saveItem(index) {
            const item = mosquesData[index];
            alert(`Mosquée "${item.nom}" sauvegardée dans votre liste.`);
        }

        function deleteItem(index) {
            mosquesData.splice(index, 1);
            renderTable();
        }

        function exportCSV() {
            if (mosquesData.length === 0) {
                alert("Aucune donnée à exporter.");
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "Nom;Ville;Adresse;Latitude;Longitude;Telephone;LienGoogleMaps\n";

            mosquesData.forEach(item => {
                const row = [
                    `"${item.nom.replace(/"/g, '""')}"`,
                    `"${item.ville.replace(/"/g, '""')}"`,
                    `"${item.adresse.replace(/"/g, '""')}"`,
                    `"${(item.lat || '').toString().replace(/"/g, '""')}"`,
                    `"${(item.lon || '').toString().replace(/"/g, '""')}"`,
                    `"${item.telephone.replace(/"/g, '""')}"`,
                    `"${item.mapsUrl}"`
                ];
                csvContent += row.join(";") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `mosquees_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
